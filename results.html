<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - Pharmacy Tech Study</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="Main navigation">
            <a class="site-brand" href="index.html">Pharmacy Tech<br class="mobile-title-break">Study</a>
            <div class="nav-links">
                <a href="index.html">Questions</a>
                <a class="active" href="results.html">Results</a>
                <a href="terminology/index.html">Terminology</a>
                <a href="practice/index.html">More Practice</a>
                <a href="extra-results.html">Extra Results</a>
            </div>
        </nav>
    </header>

    <main class="page-container">
        <section class="hero-card">
            <p class="eyebrow">Personal Bests</p>
            <h1>Quiz Results</h1>
            <p class="subtitle">Your best score for each indication is saved only on this device. Try to beat your previous score each time you take a quiz.</p>

            <div class="results-summary" id="resultsSummary"></div>
            <div class="results-table-wrap">
                <table class="best-scores-table">
                    <thead>
                        <tr>
                            <th>Indication</th>
                            <th>Best Score</th>
                            <th>Percent</th>
                        </tr>
                    </thead>
                    <tbody id="bestScoresBody"></tbody>
                </table>
            </div>

            <div class="button-row">
                <a class="btn btn-primary" href="index.html">Take a Quiz</a>
                <button id="clearScoresButton" class="btn btn-secondary" type="button">Clear Saved Scores</button>
            </div>
            <p id="clearMessage" class="study-note hidden"></p>
        </section>
    </main>

    <script src="assets/js/results.js"></script>
<script src="assets/js/nav.js"></script></body>
</html>
